name: Cache public product photos
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cache-media.yml'
      - 'assets/media-sources.json'
permissions:
  contents: write
jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/cache_media.py
      - name: Commit verified local photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          if ! git diff --cached --quiet; then
            git commit -m "Cache verified product photographs"
            git push
          fi
